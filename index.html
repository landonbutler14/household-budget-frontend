<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Household Budget</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" />
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<script src="config.js"></script>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #22c55e;
    --danger: #ef4444;
    --border: #334155;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #app { max-width: 480px; margin: 0 auto; padding: 16px 16px 90px; }
  h1 { font-size: 1.3rem; margin: 8px 0 16px; }
  h2 { font-size: 1rem; color: var(--muted); margin: 24px 0 8px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  input, button, select {
    font-size: 1rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    padding: 10px 12px;
    background: #0b1222;
    color: var(--text);
  }
  input { width: 100%; margin-bottom: 10px; }
  button {
    background: var(--accent);
    color: #052e16;
    font-weight: 600;
    border: none;
    cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .progress-track { background: #0b1222; border-radius: 6px; height: 8px; overflow: hidden; margin-top: 8px; }
  .progress-fill { height: 100%; background: var(--accent); }
  .progress-fill.over { background: var(--danger); }
  .muted { color: var(--muted); font-size: 0.85rem; }
  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; background: var(--card); border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .tabbar button {
    flex: 1; background: none; color: var(--muted); border-radius: 0; padding: 14px 0;
  }
  .tabbar button.active { color: var(--accent); }
  .hidden { display: none !important; }
  .txn-row { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .txn-row:last-child { border-bottom: none; }
  select { width: 100%; }
  .center { text-align: center; }
  a.link { color: var(--accent); }
</style>
</head>
<body>
<div id="app">

  <!-- LOGIN SCREEN -->
  <section id="screen-login">
    <h1>Household Budget</h1>
    <div class="card">
      <input id="login-username" placeholder="Username" autocomplete="username" />
      <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" />
      <button style="width:100%" onclick="login()">Log In</button>
      <p id="login-error" class="muted" style="color:var(--danger)"></p>
    </div>
  </section>

  <!-- MAIN APP -->
  <section id="screen-main" class="hidden">
    <div class="row">
      <h1>Budget</h1>
      <button class="secondary" onclick="logout()">Log out</button>
    </div>

    <!-- DASHBOARD TAB -->
    <div id="tab-dashboard">
      <div class="row">
        <input type="month" id="month-picker" style="width:auto" />
        <button class="secondary" onclick="syncNow()">Refresh</button>
      </div>
      <div id="summary-total" class="card center"></div>
      <h2>Categories</h2>
      <div id="category-list"></div>
    </div>

    <!-- TRANSACTIONS TAB -->
    <div id="tab-transactions" class="hidden">
      <h2>Transactions this month</h2>
      <div id="transaction-list"></div>
    </div>

    <!-- SETTINGS TAB -->
    <div id="tab-settings" class="hidden">
      <h2>Edit categories</h2>
      <div id="category-editor"></div>
      <div class="card">
        <input id="new-cat-name" placeholder="Category name (e.g. Groceries)" />
        <input id="new-cat-amount" type="number" placeholder="Monthly budget amount" />
        <button style="width:100%" onclick="addCategory()">Add category</button>
      </div>

      <h2>Linked accounts</h2>
      <div class="card">
        <p class="muted">Add your checking, savings, and credit card accounts. You'll log into your bank securely through Plaid — we never see or store your bank password.</p>
        <button style="width:100%" onclick="openPlaidLink()">+ Link a bank account</button>
      </div>
    </div>
  </section>

  <div id="tabbar" class="tabbar hidden">
    <button id="tab-btn-dashboard" class="active" onclick="switchTab('dashboard')">Dashboard</button>
    <button id="tab-btn-transactions" onclick="switchTab('transactions')">Transactions</button>
    <button id="tab-btn-settings" onclick="switchTab('settings')">Settings</button>
  </div>
</div>

<script>
const API = window.BUDGET_API_URL;
let token = localStorage.getItem("budget_token") || null;
let categories = [];

function authHeaders() {
  return { "Content-Type": "application/json", "Authorization": "Bearer " + token };
}

async function api(path, opts = {}) {
  const res = await fetch(API + path, { ...opts, headers: { ...authHeaders(), ...(opts.headers || {}) } });
  if (res.status === 401) { logout(); throw new Error("Unauthorized"); }
  if (!res.ok) throw new Error("Request failed: " + res.status);
  return res.json();
}

async function login() {
  const username = document.getElementById("login-username").value.trim();
  const password = document.getElementById("login-password").value;
  document.getElementById("login-error").textContent = "";
  try {
    const res = await fetch(API + "/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    if (!res.ok) throw new Error("bad creds");
    const data = await res.json();
    token = data.token;
    localStorage.setItem("budget_token", token);
    showMain();
  } catch (e) {
    document.getElementById("login-error").textContent = "Incorrect username or password.";
  }
}

function logout() {
  token = null;
  localStorage.removeItem("budget_token");
  document.getElementById("screen-login").classList.remove("hidden");
  document.getElementById("screen-main").classList.add("hidden");
  document.getElementById("tabbar").classList.add("hidden");
}

function showMain() {
  document.getElementById("screen-login").classList.add("hidden");
  document.getElementById("screen-main").classList.remove("hidden");
  document.getElementById("tabbar").classList.remove("hidden");
  const monthPicker = document.getElementById("month-picker");
  monthPicker.value = new Date().toISOString().slice(0, 7);
  monthPicker.onchange = () => { loadSummary(); loadTransactions(); };
  loadCategories();
  loadSummary();
  loadTransactions();
}

function switchTab(name) {
  ["dashboard", "transactions", "settings"].forEach((t) => {
    document.getElementById("tab-" + t).classList.toggle("hidden", t !== name);
    document.getElementById("tab-btn-" + t).classList.toggle("active", t === name);
  });
  if (name === "settings") renderCategoryEditor();
}

function currentMonth() {
  return document.getElementById("month-picker").value || new Date().toISOString().slice(0, 7);
}

function fmt(n) {
  return "$" + Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

async function loadCategories() {
  const data = await api("/categories");
  categories = data.categories || [];
}

async function loadSummary() {
  const data = await api("/summary?month=" + currentMonth());
  const totalDiv = document.getElementById("summary-total");
  const remaining = data.totalAnticipated - data.totalActual;
  totalDiv.innerHTML = `
    <div class="muted">Total spent this month</div>
    <div style="font-size:1.8rem;font-weight:700">${fmt(data.totalActual)} <span class="muted" style="font-size:1rem">of ${fmt(data.totalAnticipated)}</span></div>
    <div class="muted">${remaining >= 0 ? fmt(remaining) + " remaining" : fmt(-remaining) + " over budget"}</div>
  `;

  const list = document.getElementById("category-list");
  list.innerHTML = "";
  data.categories
    .filter((c) => c.anticipatedAmount > 0 || c.actualAmount > 0)
    .sort((a, b) => b.actualAmount - a.actualAmount)
    .forEach((c) => {
      const pct = c.anticipatedAmount > 0 ? Math.min(100, (c.actualAmount / c.anticipatedAmount) * 100) : 100;
      const over = c.anticipatedAmount > 0 && c.actualAmount > c.anticipatedAmount;
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <div class="row"><strong>${c.name}</strong><span>${fmt(c.actualAmount)} / ${fmt(c.anticipatedAmount)}</span></div>
        <div class="progress-track"><div class="progress-fill ${over ? "over" : ""}" style="width:${pct}%"></div></div>
      `;
      list.appendChild(div);
    });
}

async function loadTransactions() {
  const data = await api("/transactions?month=" + currentMonth());
  const list = document.getElementById("transaction-list");
  list.innerHTML = "";
  if (!data.transactions.length) {
    list.innerHTML = `<p class="muted">No transactions yet this month.</p>`;
    return;
  }
  data.transactions.forEach((t) => {
    const div = document.createElement("div");
    div.className = "txn-row";
    const options = categories
      .map((c) => `<option value="${c.categoryId}" ${t.categoryId === c.categoryId ? "selected" : ""}>${c.name}</option>`)
      .join("");
    div.innerHTML = `
      <div class="row">
        <div>
          <div>${t.name}</div>
          <div class="muted">${t.date} · ${t.institutionName || ""}${t.pending ? " · pending" : ""}</div>
        </div>
        <strong>${t.amount < 0 ? "+" : ""}${fmt(Math.abs(t.amount))}</strong>
      </div>
      <select onchange="categorize('${t.transactionId}', this.value)">
        <option value="">Uncategorized</option>
        ${options}
      </select>
    `;
    list.appendChild(div);
  });
}

async function categorize(transactionId, categoryId) {
  await api("/transactions/categorize", {
    method: "PUT",
    body: JSON.stringify({ transactionId, categoryId: categoryId || null, saveRule: true }),
  });
  loadSummary();
}

function renderCategoryEditor() {
  const div = document.getElementById("category-editor");
  div.innerHTML = "";
  categories.forEach((c) => {
    const row = document.createElement("div");
    row.className = "card";
    row.innerHTML = `
      <input value="${c.name}" onchange="updateCategory('${c.categoryId}', 'name', this.value)" />
      <input type="number" value="${c.anticipatedAmount}" onchange="updateCategory('${c.categoryId}', 'anticipatedAmount', this.value)" />
      <button class="danger" style="width:100%" onclick="deleteCategory('${c.categoryId}')">Delete category</button>
    `;
    div.appendChild(row);
  });
}

async function updateCategory(categoryId, field, value) {
  const cat = categories.find((c) => c.categoryId === categoryId);
  if (!cat) return;
  cat[field] = field === "anticipatedAmount" ? Number(value) : value;
  await api("/categories", { method: "POST", body: JSON.stringify(cat) });
  loadSummary();
}

async function deleteCategory(categoryId) {
  if (!confirm("Delete this category?")) return;
  await api("/categories/" + categoryId, { method: "DELETE" });
  await loadCategories();
  renderCategoryEditor();
  loadSummary();
}

async function addCategory() {
  const name = document.getElementById("new-cat-name").value.trim();
  const anticipatedAmount = Number(document.getElementById("new-cat-amount").value) || 0;
  if (!name) return;
  await api("/categories", { method: "POST", body: JSON.stringify({ name, anticipatedAmount, merchantRules: [] }) });
  document.getElementById("new-cat-name").value = "";
  document.getElementById("new-cat-amount").value = "";
  await loadCategories();
  renderCategoryEditor();
  loadSummary();
}

async function syncNow() {
  await api("/sync-now", { method: "POST" });
  loadSummary();
  loadTransactions();
}

async function openPlaidLink() {
  const { link_token } = await api("/plaid/link-token", { method: "POST" });
  const handler = Plaid.create({
    token: link_token,
    onSuccess: async (public_token, metadata) => {
      await api("/plaid/exchange-token", {
        method: "POST",
        body: JSON.stringify({ public_token, institution_name: metadata.institution?.name }),
      });
      alert("Account linked! Tap Refresh on the Dashboard to pull transactions.");
    },
  });
  handler.open();
}

// Auto-login if a token is already saved
if (token) showMain();

// Register service worker for installability
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
